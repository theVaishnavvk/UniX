<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniX - Chat</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Combined Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            height: calc(100vh - 150px);
            display: flex;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 300px;
            border-right: 1px solid #f3f4f6;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f3f4f6;
            font-weight: 700;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover {
            background: #f9fafb;
        }

        .user-item.active {
            background: #f3f0ff;
            border-right: 3px solid #6a5af9;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #6a5af9;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fdfdff;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid #f3f4f6;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .msg-received {
            align-self: flex-start;
            background: white;
            border: 1px solid #f3f4f6;
            border-bottom-left-radius: 4px;
        }

        .msg-sent {
            align-self: flex-end;
            background: #6a5af9;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.7;
            display: block;
            text-align: right;
        }

        .chat-input-area {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #f3f4f6;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid #f3f4f6;
            background: #f9fafb;
            outline: none;
        }

        .file-upload-btn {
            color: #6b7280;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .file-upload-btn:hover {
            color: #6a5af9;
        }

        .file-attachment {
            display: block;
            margin-top: 5px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            color: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div id="navbar-container"></div>
        <div class="page-content">
            <div class="chat-container">
                <div class="chat-sidebar">
                    <div class="sidebar-header">Recent Chats</div>
                    <div class="user-list" id="userList">
                        <!-- Users will be listed here -->
                        <p style="padding:20px; color:#6b7280; text-align:center;">Loading users...</p>
                    </div>
                </div>
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="user-avatar" id="activeUserAvatar">?</div>
                            <div>
                                <h4 id="activeUserName">Select a user</h4>
                                <small id="activeUserStatus" style="color:#10b981;">Online</small>
                            </div>
                        </div>
                        <a href="#" id="viewProfileBtn" class="secondary-btn"
                            style="padding:8px 15px; font-size:12px; display:none;">View Profile</a>
                    </div>

                    <div class="messages-area" id="messagesArea">
                        <div style="margin:auto; text-align:center; color:#6b7280;">
                            <i class="fa-solid fa-comments"
                                style="font-size:48px; margin-bottom:15px; opacity:0.3;"></i>
                            <p>Select a user to start chatting</p>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <label for="fileInput" class="file-upload-btn">
                            <i class="fa-solid fa-paperclip"></i>
                        </label>
                        <input type="file" id="fileInput" style="display:none;">
                        <input type="text" id="messageInput" class="chat-input" placeholder="Type your message..."
                            disabled>
                        <button class="primary-btn" id="sendBtn" style="padding:10px 20px;" disabled>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage } from "./js/firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { collection, addDoc, onSnapshot, query, orderBy, where, doc, getDoc, getDocs, or, and } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

        let activeChatId = null;
        let activeUserId = null;
        let unsubscribeMessages = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            loadNavbar();
            loadUsers(user.uid);

            const urlParams = new URLSearchParams(window.location.search);
            const targetUid = urlParams.get('uid');
            if (targetUid) {
                // Pre-select user from URL if redirected from elsewhere
                setTimeout(() => {
                    const userItem = document.querySelector(`.user-item[data-uid="${targetUid}"]`);
                    if (userItem) userItem.click();
                    else startChatWith(targetUid);
                }, 1000);
            }
        });

        async function loadUsers(currentUid) {
            const userList = document.getElementById("userList");
            const snapshot = await getDocs(collection(db, "users"));
            userList.innerHTML = "";

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (docSnap.id === currentUid) return;

                const div = document.createElement("div");
                div.className = "user-item";
                div.dataset.uid = docSnap.id;
                div.innerHTML = `
                    <div class="user-avatar">${data.name ? data.name.charAt(0).toUpperCase() : '?'}</div>
                    <div class="user-info">
                        <div style="font-weight:600;">${data.name || "User"}</div>
                        <small style="color:#6b7280;">Click to chat</small>
                    </div>
                `;
                div.onclick = () => selectUser(docSnap.id, data.name);
                userList.appendChild(div);
            });
        }

        async function selectUser(uid, name) {
            activeUserId = uid;
            document.getElementById("activeUserName").innerText = name;
            document.getElementById("activeUserAvatar").innerText = name.charAt(0).toUpperCase();
            document.getElementById("viewProfileBtn").style.display = "block";
            document.getElementById("viewProfileBtn").href = `profile.html?uid=${uid}`;
            document.getElementById("messageInput").disabled = false;
            document.getElementById("sendBtn").disabled = false;

            document.querySelectorAll(".user-item").forEach(i => i.classList.remove("active"));
            const activeItem = document.querySelector(`.user-item[data-uid="${uid}"]`);
            if (activeItem) activeItem.classList.add("active");

            startChatWith(uid);
        }

        function startChatWith(targetUid) {
            const myUid = auth.currentUser.uid;
            const chatId = myUid < targetUid ? `${myUid}_${targetUid}` : `${targetUid}_${myUid}`;
            activeChatId = chatId;

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                renderMessages(snapshot.docs);
            });
        }

        function renderMessages(docs) {
            const area = document.getElementById("messagesArea");
            area.innerHTML = "";
            const myUid = auth.currentUser.uid;

            docs.forEach(docSnap => {
                const msg = docSnap.data();
                const div = document.createElement("div");
                div.className = `message ${msg.senderId === myUid ? 'msg-sent' : 'msg-received'}`;

                let content = msg.text;
                if (msg.fileUrl) {
                    content += `<a href="${msg.fileUrl}" target="_blank" class="file-attachment" style="color: ${msg.senderId === myUid ? 'white' : 'inherit'}">
                        <i class="fa-solid fa-file"></i> ${msg.fileName || 'Attachment'}
                    </a>`;
                }

                div.innerHTML = `
                    ${content}
                    <span class="msg-time">${msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...'}</span>
                `;
                area.appendChild(div);
            });
            area.scrollTop = area.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text && !activeUserId) return;

            const myUid = auth.currentUser.uid;
            const chatId = activeChatId;

            try {
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: myUid,
                    text: text,
                    createdAt: new Date()
                });
                input.value = "";
            } catch (e) {
                console.error("Error sending message:", e);
            }
        }

        document.getElementById("sendBtn").onclick = sendMessage;
        document.getElementById("messageInput").onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // File upload logic
        document.getElementById("fileInput").onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !activeChatId) return;

            const myUid = auth.currentUser.uid;
            const storageRef = ref(storage, `chats/${activeChatId}/${Date.now()}_${file.name}`);

            try {
                const snapshot = await uploadBytes(storageRef, file);
                const url = await getDownloadURL(snapshot.ref);

                await addDoc(collection(db, "chats", activeChatId, "messages"), {
                    senderId: myUid,
                    text: "Sent a file:",
                    fileUrl: url,
                    fileName: file.name,
                    createdAt: new Date()
                });
            } catch (err) {
                console.error("Upload error:", err);
                alert("Failed to upload file.");
            }
        };

        function loadNavbar() {
            fetch("navbar.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("navbar-container").innerHTML = data;
                    document.querySelectorAll(".nav-links a").forEach(link => {
                        if (link.dataset.link === "chat") link.classList.add("active");
                    });

                    const logoutBtn = document.getElementById("logoutBtn");
                    if (logoutBtn) {
                        logoutBtn.addEventListener("click", async (e) => {
                            e.preventDefault();
                            await signOut(auth);
                            window.location.href = "home.html";
                        });
                    }

                    // Update points and name
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userSnap = await getDoc(doc(db, "users", user.uid));
                            if (userSnap.exists()) {
                                const ud = userSnap.data();
                                if (document.getElementById("usernameValue")) document.getElementById("usernameValue").innerText = ud.name || "User";
                                if (document.getElementById("navPointsValue")) document.getElementById("navPointsValue").innerText = ud.points || 0;
                            }
                        }
                    });
                });
        }
    </script>
</body>

</html>
