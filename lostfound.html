<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniX - Lost & Found</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Combined Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .lostfound-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .item-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s ease;
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .item-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-lost {
            background: #fee2e2;
            color: #ef4444;
        }

        .status-found {
            background: #e0f2fe;
            color: #0ea5e9;
        }

        .status-claimed {
            background: #f0fdf4;
            color: #22c55e;
        }

        .item-image {
            width: 100%;
            height: 200px;
            background: #f3f4f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #9ca3af;
            font-size: 40px;
        }

        .item-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .item-desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #9ca3af;
        }

        .item-meta i {
            margin-right: 5px;
        }

        /* Modal specific */
        .modal-box textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 6px;
            height: 100px;
            resize: none;
        }

        /* AI Panel */
        .ai-panel {
            background: linear-gradient(135deg, #f5f3ff, #ede9fe);
            border: 1px solid #c4b5fd;
            border-radius: 20px;
            padding: 22px 26px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .ai-panel::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15), transparent);
            border-radius: 50%;
        }

        .ai-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .ai-panel-header h4 {
            font-size: 15px;
            font-weight: 700;
            color: #5b21b6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-refresh-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .ai-refresh-btn:hover {
            opacity: 0.85;
        }

        .ai-refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-response {
            font-size: 14px;
            color: #4c1d95;
            line-height: 1.7;
            min-height: 40px;
        }

        .ai-thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7c3aed;
            font-size: 13px;
        }

        .ai-dot {
            width: 8px;
            height: 8px;
            background: #7c3aed;
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .ai-dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .ai-dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.2
            }

            50% {
                opacity: 1
            }
        }
    </style>
</head>

<body>
    <div class="layout">
        <div id="navbar-container"></div>
        <div class="page-content">
            <div class="lostfound-container">
                <div class="action-row"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <div>
                        <h1>Lost & Found</h1>
                        <p class="subtitle">Report lost items or help others find theirs</p>
                    </div>
                    <button class="primary-btn" id="openReportModal">
                        <i class="fa-solid fa-plus"></i> Report Item
                    </button>
                </div>

                <div class="request-tabs">
                    <button class="tab-btn active" data-tab="all">All Items</button>
                    <button class="tab-btn" data-tab="lost">Lost</button>
                    <button class="tab-btn" data-tab="found">Found</button>
                    <button class="tab-btn" data-tab="my">My Reports</button>
                </div>


                <div id="itemsGrid" class="item-grid">
                    <!-- Items will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Report Item Modal -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Report Item</h3>
            </div>

            <label>Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Blue Backpack">

            <label>Description</label>
            <textarea id="itemDesc" placeholder="Describe the item, location where lost/found, etc."></textarea>

            <label>Category</label>
            <select id="itemCategory">
                <option value="Electronics">Electronics</option>
                <option value="Documents">Documents</option>
                <option value="Keys">Keys</option>
                <option value="Accessories">Accessories</option>
                <option value="Other">Other</option>
            </select>

            <label>Status</label>
            <select id="itemStatus">
                <option value="lost">I lost this</option>
                <option value="found">I found this</option>
            </select>

            <label>Location</label>
            <input type="text" id="itemLocation" placeholder="e.g. Science Block, Room 204">

            <div class="modal-actions">
                <button class="primary-btn" id="submitReport">Submit Report</button>
                <button class="secondary-btn" id="cancelReport">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./js/firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Navbar loading
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar-container").innerHTML = data;
                setActiveLink();

                const logoutBtn = document.getElementById("logoutBtn");
                if (logoutBtn) {
                    logoutBtn.addEventListener("click", async (e) => {
                        e.preventDefault();
                        await signOut(auth);
                        window.location.href = "home.html";
                    });
                }
            });

        function setActiveLink() {
            const currentPage = "lostfound";
            document.querySelectorAll(".nav-links a").forEach(link => {
                if (link.dataset.link === currentPage) {
                    link.classList.add("active");
                }
            });
        }

        // Main Logic
        const reportModal = document.getElementById("reportModal");
        const openReportModal = document.getElementById("openReportModal");
        const cancelReport = document.getElementById("cancelReport");
        const submitReport = document.getElementById("submitReport");
        const itemsGrid = document.getElementById("itemsGrid");
        const tabs = document.querySelectorAll(".tab-btn");

        let currentTab = "all";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            loadItems();

            // Update User info in Navbar if exists
            const fetchInfo = async () => {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    if (document.getElementById("usernameValue")) document.getElementById("usernameValue").innerText = userData.name || "User";
                    if (document.getElementById("navPointsValue")) document.getElementById("navPointsValue").innerText = userData.points || 0;
                }
            };
            fetchInfo();
        });

        openReportModal.onclick = () => reportModal.style.display = "flex";
        cancelReport.onclick = () => reportModal.style.display = "none";

        submitReport.onclick = async () => {
            const user = auth.currentUser;
            if (!user) return;

            const name = document.getElementById("itemName").value;
            const desc = document.getElementById("itemDesc").value;
            const category = document.getElementById("itemCategory").value;
            const status = document.getElementById("itemStatus").value;
            const location = document.getElementById("itemLocation").value;

            if (!name || !desc || !location) {
                alert("Please fill all fields");
                return;
            }

            try {
                await addDoc(collection(db, "lostItems"), {
                    name,
                    desc,
                    category,
                    status,
                    location,
                    createdBy: user.uid,
                    createdAt: serverTimestamp(),
                    userName: user.displayName || "Anonymous"
                });

                // Add to transactions for dashboard awareness
                await addDoc(collection(db, "transactions"), {
                    userId: user.uid,
                    title: `Reported ${status}: ${name}`,
                    category: "lostfound",
                    createdAt: serverTimestamp()
                });

                reportModal.style.display = "none";
                alert("Report submitted successfully!");
                // Clear fields
                document.getElementById("itemName").value = "";
                document.getElementById("itemDesc").value = "";
                document.getElementById("itemLocation").value = "";
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        };

        let unsubscribeItems = null;

        function loadItems() {
            // Unsubscribe from old listener before creating a new one
            if (unsubscribeItems) unsubscribeItems();
            let q = query(collection(db, "lostItems"), orderBy("createdAt", "desc"));
            unsubscribeItems = onSnapshot(q, (snapshot) => {
                renderItems(snapshot.docs);
            });
        }

        async function renderItems(docs) {
            itemsGrid.innerHTML = "";
            const user = auth.currentUser;

            let filteredDocs = docs;
            if (currentTab === "lost") filteredDocs = docs.filter(d => d.data().status === "lost");
            else if (currentTab === "found") filteredDocs = docs.filter(d => d.data().status === "found");
            else if (currentTab === "my") filteredDocs = docs.filter(d => d.data().createdBy === user.uid);

            if (filteredDocs.length === 0) {
                itemsGrid.innerHTML = "<p style='text-align:center; grid-column: 1/-1; padding: 50px; color: #6b7280;'>No items reported yet.</p>";
                return;
            }

            for (const docSnap of filteredDocs) {
                const data = docSnap.data();
                const card = document.createElement("div");
                card.className = "item-card";

                let icon = data.category === "Electronics" ? "fa-laptop" :
                    data.category === "Documents" ? "fa-file-invoice" :
                        data.category === "Keys" ? "fa-key" : "fa-box";

                card.innerHTML = `
                    <div class="item-status status-${data.status}">${data.status}</div>
                    <div class="item-image">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                    <h3 class="item-title">${data.name}</h3>
                    <p class="item-desc">${data.desc}</p>
                    <div class="item-meta">
                        <span><i class="fa-solid fa-location-dot"></i> ${data.location}</span>
                        <span><i class="fa-solid fa-clock"></i> ${data.createdAt?.seconds
                        ? new Date(data.createdAt.seconds * 1000).toLocaleDateString()
                        : data.createdAt?.toDate
                            ? data.createdAt.toDate().toLocaleDateString()
                            : "Just now"}</span>
                    </div>
                    ${data.createdBy === user.uid ? `<button class="secondary-btn" style="margin-top:15px; width:100%; border-color:#ef4444; color:#ef4444;" onclick="deleteReport('${docSnap.id}')">Delete Report</button>` : ""}
                    ${data.status !== 'claimed' && data.createdBy !== user.uid ? `<button class="primary-btn" style="margin-top:15px; width:100%;" onclick="contactReporter('${data.createdBy}')">Contact</button>` : ""}
                `;
                itemsGrid.appendChild(card);
            }
        }

        window.deleteReport = async (id) => {
            if (confirm("Are you sure you want to delete this report?")) {
                await deleteDoc(doc(db, "lostItems", id));
            }
        };

        window.contactReporter = (uid) => {
            window.location.href = `chat.html?uid=${uid}`;
        };

        tabs.forEach(tab => {
            tab.onclick = () => {
                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                currentTab = tab.dataset.tab;
                loadItems(); // Re-render with current filter
            };
        });

    </script>
</body>

</html>
