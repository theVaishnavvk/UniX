<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniX - Profile</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Combined Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Navbar avatar tweak */
        #navAvatarImg {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 5px;
        }

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .profile-header {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            position: relative;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a5af9, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
            box-shadow: 0 10px 20px rgba(106, 90, 249, 0.2);
        }

        .profile-info h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .profile-id {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .profile-badges {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .ranking-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-gold {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .badge-silver {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #9ca3af;
        }

        .badge-bronze {
            background: #ffedd5;
            color: #9a3412;
            border: 1px solid #ea580c;
        }

        .badge-regular {
            background: #e0e7ff;
            color: #3730a3;
            border: 1px solid #6366f1;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .profile-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .profile-card h3 {
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #6b7280;
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: #111827;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: #f3f4f6;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: #4b5563;
        }

        .txn-list {
            max-height: 400px;
            overflow-y: auto;
        }

        /* ── Profile photo / avatar ── */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a5af9, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 50px;
            box-shadow: 0 10px 20px rgba(106, 90, 249, 0.2);
            overflow: hidden;
            cursor: default;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-edit-overlay {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 22px;
            transition: opacity 0.2s;
        }

        .avatar-wrapper:hover .avatar-edit-overlay {
            display: flex;
        }

        /* ── Edit profile button ── */
        .edit-profile-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #6a5af9, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 7px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 12px rgba(106, 90, 249, 0.3);
        }

        .edit-profile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(106, 90, 249, 0.4);
        }

        /* ── Edit Profile Modal ── */
        .ep-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .ep-overlay.open {
            display: flex;
        }

        .ep-modal {
            background: #fff;
            border-radius: 24px;
            padding: 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .ep-modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #111827;
        }

        .ep-field {
            margin-bottom: 18px;
        }

        .ep-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .ep-field input,
        .ep-field select,
        .ep-field textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
            box-sizing: border-box;
        }

        .ep-field input:focus,
        .ep-field select:focus,
        .ep-field textarea:focus {
            border-color: #6a5af9;
        }

        .ep-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .ep-btn-cancel {
            padding: 10px 22px;
            border-radius: 12px;
            border: 1.5px solid #e5e7eb;
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #374151;
            transition: background 0.15s;
        }

        .ep-btn-cancel:hover {
            background: #f3f4f6;
        }

        .ep-btn-save {
            padding: 10px 26px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6a5af9, #7c3aed);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 90, 249, 0.3);
            transition: transform 0.15s;
        }

        .ep-btn-save:hover {
            transform: translateY(-2px);
        }

        .ep-btn-remove-photo {
            display: none;
            width: 100%;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid #fee2e2;
            background: #fff;
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .ep-btn-remove-photo:hover {
            background: #fef2f2;
        }

        .ep-upload-progress {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div id="navbar-container"></div>
        <div class="page-content">
            <div class="profile-container">
                <div class="profile-header">
                    <!-- Avatar with camera overlay for photo change -->
                    <div class="avatar-wrapper" id="avatarWrapper">
                        <div class="profile-avatar" id="profileAvatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="avatar-edit-overlay" id="avatarEditOverlay" title="Change photo">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <input type="file" id="photoFileInput" accept="image/*" style="display:none">
                    </div>

                    <div class="profile-info">
                        <h1 id="profileName">Loading...</h1>
                        <p class="profile-id" id="profileEmail">...</p>
                        <div class="profile-badges" id="profileBadges">
                            <!-- Badges injected here -->
                        </div>
                    </div>
                    <div style="margin-left: auto; text-align: right;">
                        <p style="color:#6b7280; font-size:12px; font-weight:600; text-transform:uppercase;">Current
                            Points</p>
                        <h2 style="font-size:36px; color:#6a5af9;"><i class="fa-solid fa-coins"></i> <span
                                id="profilePoints">0</span></h2>
                    </div>

                    <!-- Edit button – shown only for own profile -->
                    <button class="edit-profile-btn" id="editProfileBtn">
                        <i class="fa-solid fa-pen"></i> Edit Profile
                    </button>
                </div>

                <!-- Edit Profile Modal -->
                <div class="ep-overlay" id="epOverlay">
                    <div class="ep-modal">
                        <h2><i class="fa-solid fa-user-pen" style="color:#6a5af9"></i> Edit Profile</h2>

                        <div class="ep-field">
                            <label>Full Name</label>
                            <input type="text" id="epName" placeholder="Your full name">
                        </div>

                        <div class="ep-field">
                            <label>Role</label>
                            <select id="epRole">
                                <option value="Student">Student</option>
                                <option value="Faculty">Faculty</option>
                                <option value="Staff">Staff</option>
                                <option value="Alumni">Alumni</option>
                            </select>
                        </div>

                        <div class="ep-field">
                            <label>Skills &amp; Expertise <span
                                    style="font-weight:400;text-transform:none;">(comma-separated)</span></label>
                            <textarea id="epSkills" rows="3"
                                placeholder="e.g. JavaScript, Graphic Design, Public Speaking"></textarea>
                        </div>

                        <button class="ep-btn-remove-photo" id="epRemovePhoto">
                            <i class="fa-solid fa-trash-can"></i> Remove Profile Photo
                        </button>

                        <div class="ep-footer">
                            <button class="ep-btn-cancel" id="epCancel">Cancel</button>
                            <button class="ep-btn-save" id="epSave"><i class="fa-solid fa-floppy-disk"></i>
                                Save</button>
                        </div>
                    </div>
                </div>

                <div class="profile-grid">
                    <div class="profile-card">
                        <h3><i class="fa-solid fa-circle-info"></i> User Details</h3>
                        <div class="detail-item">
                            <span class="detail-label">Role</span>
                            <span class="detail-value" id="profileRole">Student</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Reputation Rank</span>
                            <span class="detail-value" id="profileRank">Silver Wizard</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Total Transactions</span>
                            <span class="detail-value" id="profileTxnCount">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Member Since</span>
                            <span class="detail-value" id="profileDate">Jan 2024</span>
                        </div>
                    </div>

                    <div class="profile-card">
                        <h3><i class="fa-solid fa-bolt"></i> Skills & Expertise</h3>
                        <div class="skills-list" id="profileSkills">
                            <span class="skill-tag">JavaScript</span>
                            <span class="skill-tag">Graphic Design</span>
                            <span class="skill-tag">Public Speaking</span>
                        </div>
                    </div>

                    <div class="profile-card" style="grid-column: 1 / -1;">
                        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Transactions</h3>
                        <div class="txn-list" id="profileTxnList">
                            <p style="color:#6b7280; text-align:center; padding: 20px;">No transactions recorded.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage } from "./js/firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { doc, getDoc, updateDoc, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

        let currentUser = null; // track logged-in user

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const urlParams = new URLSearchParams(window.location.search);
            const targetUid = urlParams.get('uid') || (user ? user.uid : null);

            if (!targetUid) {
                window.location.href = "login.html";
                return;
            }

            // Show edit controls only when viewing own profile
            const isOwn = user && user.uid === targetUid;
            if (isOwn) {
                document.getElementById("editProfileBtn").style.display = "flex";
                document.getElementById("avatarEditOverlay").style.cursor = "pointer";
            }

            loadProfile(targetUid);
            loadNavbar();
            setupEditControls(targetUid, isOwn);
        });

        async function loadProfile(uid) {
            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById("profileName").innerText = data.name || "User";
                    document.getElementById("profilePoints").innerText = data.points || 0;
                    document.getElementById("profileRole").innerText = data.role || "Student";

                    // Format Join Date
                    if (data.createdAt) {
                        const date = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                        const options = { month: 'short', year: 'numeric' };
                        document.getElementById("profileDate").innerText = date.toLocaleDateString('en-US', options);
                    }

                    // Show photo if available, else initial letter
                    const avatarEl = document.getElementById("profileAvatar");
                    if (data.photoURL) {
                        avatarEl.innerHTML = `<img src="${data.photoURL}" alt="Profile Photo">`;
                    } else {
                        avatarEl.innerHTML = data.name ? data.name.charAt(0).toUpperCase() : '<i class="fa-solid fa-user"></i>';
                    }

                    if (data.skills && Array.isArray(data.skills)) {
                        const skillsContainer = document.getElementById("profileSkills");
                        skillsContainer.innerHTML = "";
                        data.skills.forEach(skill => {
                            const span = document.createElement("span");
                            span.className = "skill-tag";
                            span.innerText = skill;
                            skillsContainer.appendChild(span);
                        });
                    }

                    // Ranking Badge Logic
                    updateBadges(data.points || 0, uid);
                }

                // Load Transactions
                loadTransactions(uid);
            } catch (error) {
                console.error("Error loading profile:", error);
            }
        }

        async function updateBadges(points, uid) {
            const badgesContainer = document.getElementById("profileBadges");
            badgesContainer.innerHTML = "";

            // Simple point-based badges for now
            if (points >= 1000) {
                badgesContainer.innerHTML += '<span class="ranking-badge badge-gold"><i class="fa-solid fa-trophy"></i> Top 1%</span>';
            } else if (points >= 500) {
                badgesContainer.innerHTML += '<span class="ranking-badge badge-silver"><i class="fa-solid fa-medal"></i> Elite Member</span>';
            } else if (points >= 100) {
                badgesContainer.innerHTML += '<span class="ranking-badge badge-bronze"><i class="fa-solid fa-award"></i> Rising Star</span>';
            } else {
                badgesContainer.innerHTML += '<span class="ranking-badge badge-regular">Newcomer</span>';
            }

            // Check if user is in top 3 overall
            const q = query(collection(db, "users"), orderBy("points", "desc"), limit(3));
            const snapshot = await getDocs(q);
            let rank = 0;
            snapshot.docs.forEach((docSnap, index) => {
                if (docSnap.id === uid) rank = index + 1;
            });

            if (rank === 1) badgesContainer.innerHTML += '<span class="ranking-badge badge-gold">#1 Campus Leader</span>';
            else if (rank === 2) badgesContainer.innerHTML += '<span class="ranking-badge badge-silver">#2 Top Peer</span>';
            else if (rank === 3) badgesContainer.innerHTML += '<span class="ranking-badge badge-bronze">#3 Skill Master</span>';
        }

        async function loadTransactions(uid) {
            const txnList = document.getElementById("profileTxnList");
            const q = query(collection(db, "transactions"), where("userId", "==", uid), orderBy("createdAt", "desc"));
            const snapshot = await getDocs(q);

            document.getElementById("profileTxnCount").innerText = snapshot.size;

            if (snapshot.empty) return;

            txnList.innerHTML = "";
            snapshot.forEach(docSnap => {
                const txn = docSnap.data();
                const div = document.createElement("div");
                div.className = "txn-item";
                div.innerHTML = `
                    <div class="txn-left">
                        <i class="fa-solid fa-arrow-right-arrow-left txn-icon ${txn.category === 'skill' ? 'purple' : (txn.category === 'marketplace' ? 'green' : 'yellow')}"></i>
                        <span class="txn-title">${txn.title}</span>
                    </div>
                `;
                txnList.appendChild(div);
            });
        }

        /* ══════════════════════════════════════════
           EDIT PROFILE & PHOTO UPLOAD LOGIC
        ══════════════════════════════════════════ */
        function setupEditControls(uid, isOwn) {
            if (!isOwn) return;

            /* ── Photo upload via camera overlay ── */
            const avatarOverlay = document.getElementById("avatarEditOverlay");
            const photoInput = document.getElementById("photoFileInput");

            avatarOverlay.addEventListener("click", () => photoInput.click());

            photoInput.addEventListener("change", async () => {
                const file = photoInput.files[0];
                if (!file) return;

                // Show a subtle uploading indicator on the avatar
                const avatarEl = document.getElementById("profileAvatar");
                avatarEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

                try {
                    const imgRef = storageRef(storage, `profilePhotos/${uid}/${Date.now()}_${file.name}`);
                    const uploadTask = uploadBytesResumable(imgRef, file);

                    uploadTask.on(
                        "state_changed",
                        null,
                        (err) => {
                            console.error("Upload failed:", err);
                            avatarEl.innerHTML = '<i class="fa-solid fa-user"></i>';
                            alert("Photo upload failed. Please try again.");
                        },
                        async () => {
                            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                            // Save URL to Firestore
                            await updateDoc(doc(db, "users", uid), { photoURL: downloadURL });
                            avatarEl.innerHTML = `<img src="${downloadURL}" alt="Profile Photo">`;
                        }
                    );
                } catch (err) {
                    console.error("Photo error:", err);
                    avatarEl.innerHTML = '<i class="fa-solid fa-user"></i>';
                }
            });

            /* ── Edit Profile Modal ── */
            const overlay = document.getElementById("epOverlay");
            const editBtn = document.getElementById("editProfileBtn");
            const cancelBtn = document.getElementById("epCancel");
            const saveBtn = document.getElementById("epSave");

            // Open modal and pre-fill current values
            editBtn.addEventListener("click", async () => {
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById("epName").value = d.name || "";
                    document.getElementById("epRole").value = d.role || "Student";
                    document.getElementById("epSkills").value = (d.skills || []).join(", ");

                    // Show/hide remove photo button
                    document.getElementById("epRemovePhoto").style.display = d.photoURL ? "block" : "none";
                }
                overlay.classList.add("open");
            });

            // Remove photo
            document.getElementById("epRemovePhoto").addEventListener("click", async () => {
                if (!confirm("Are you sure you want to remove your profile photo?")) return;

                try {
                    await updateDoc(doc(db, "users", uid), { photoURL: null });
                    const avatarEl = document.getElementById("profileAvatar");
                    const name = document.getElementById("profileName").innerText;
                    avatarEl.innerHTML = name.charAt(0).toUpperCase();
                    document.getElementById("epRemovePhoto").style.display = "none";

                    // Update navbar avatar if current user
                    const navAvatar = document.getElementById("usernameValue");
                    if (navAvatar) {
                        navAvatar.parentElement.innerHTML = `<i class="fa-regular fa-user"></i> <span id="usernameValue">${name}</span>`;
                    }
                } catch (err) {
                    console.error("Remove photo failed:", err);
                }
            });

            // Close modal
            cancelBtn.addEventListener("click", () => overlay.classList.remove("open"));
            overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });

            // Save changes
            saveBtn.addEventListener("click", async () => {
                const newName = document.getElementById("epName").value.trim();
                const newRole = document.getElementById("epRole").value;
                const rawSkills = document.getElementById("epSkills").value;
                const newSkills = rawSkills.split(",").map(s => s.trim()).filter(Boolean);

                if (!newName) { alert("Name cannot be empty."); return; }

                saveBtn.textContent = "Saving...";
                saveBtn.disabled = true;

                try {
                    await updateDoc(doc(db, "users", uid), {
                        name: newName,
                        role: newRole,
                        skills: newSkills,
                    });

                    // Reflect changes immediately on the page
                    document.getElementById("profileName").innerText = newName;
                    document.getElementById("profileRole").innerText = newRole;

                    const skillsContainer = document.getElementById("profileSkills");
                    skillsContainer.innerHTML = "";
                    newSkills.forEach(skill => {
                        const span = document.createElement("span");
                        span.className = "skill-tag";
                        span.innerText = skill;
                        skillsContainer.appendChild(span);
                    });

                    // Update avatar initial if no photo
                    const avatarEl = document.getElementById("profileAvatar");
                    if (!avatarEl.querySelector("img")) {
                        avatarEl.innerHTML = newName.charAt(0).toUpperCase();
                    }

                    overlay.classList.remove("open");
                } catch (err) {
                    console.error("Save failed:", err);
                    alert("Failed to save changes. Try again.");
                } finally {
                    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save';
                    saveBtn.disabled = false;
                }
            });
        }

        function loadNavbar() {
            fetch("navbar.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("navbar-container").innerHTML = data;
                    const urlParams = new URLSearchParams(window.location.search);
                    if (!urlParams.get('uid')) {
                        // Only highlight if it's "My Profile"
                        document.querySelectorAll(".nav-links a").forEach(link => {
                            if (link.href.includes("profile.html")) {
                                link.classList.add("active");
                            }
                        });
                    }

                    // Setup logout
                    const logoutBtn = document.getElementById("logoutBtn");
                    if (logoutBtn) {
                        logoutBtn.addEventListener("click", async (e) => {
                            e.preventDefault();
                            await signOut(auth);
                            window.location.href = "home.html";
                        });
                    }

                    // Update points and name in navbar
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userSnap = await getDoc(doc(db, "users", user.uid));
                            if (userSnap.exists()) {
                                const ud = userSnap.data();
                                const name = ud.name || "User";
                                if (document.getElementById("usernameValue")) {
                                    const userVal = document.getElementById("usernameValue");
                                    if (ud.photoURL) {
                                        userVal.parentElement.innerHTML = `<img src="${ud.photoURL}" id="navAvatarImg" alt=""> <span id="usernameValue">${name}</span>`;
                                    } else {
                                        userVal.parentElement.innerHTML = `<i class="fa-regular fa-user"></i> <span id="usernameValue">${name}</span>`;
                                    }
                                }
                                if (document.getElementById("navPointsValue")) document.getElementById("navPointsValue").innerText = ud.points || 0;
                            }
                        }
                    });
                });
        }
    </script>
</body>

</html>
